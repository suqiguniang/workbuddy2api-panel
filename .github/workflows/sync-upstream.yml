name: Sync fork with upstream

on:
  schedule:
    # 00:00 Asia/Shanghai (UTC+8) = 16:00 UTC previous day
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull upstream into this fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -d '{"branch":"main"}')
          body=$(printf '%s\n' "$response" | sed '$d')
          code=$(printf '%s\n' "$response" | tail -n1)
          echo "$body"
          if [ "$code" = "200" ]; then
            echo "### Upstream synced ✅" >> "$GITHUB_STEP_SUMMARY"
            # GITHUB_TOKEN 做的推送不会触发其他 workflow，这里显式派发 arm64 构建
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-linux-arm64.yml/dispatches" \
              -d '{"ref":"main"}'
          elif [ "$code" = "409" ]; then
            echo "::error::Merge conflict with upstream — manual resolution needed."
            echo "### Merge conflict ⚠️ upstream could not be merged automatically" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "::error::merge-upstream failed with HTTP $code"
            exit 1
          fi
