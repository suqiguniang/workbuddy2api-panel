name: build-linux-arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: version
        run: echo "VERSION=$(TZ=Asia/Shanghai date +%Y.%-m.%-d.%-H%M)" >> "$GITHUB_ENV"

      - name: build linux/arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" \
            -o dist/wb2api-linux-arm64 ./cmd/server
          chmod +x dist/wb2api-linux-arm64
          (cd dist && sha256sum wb2api-linux-arm64 > wb2api-linux-arm64.sha256)
          file dist/wb2api-linux-arm64 || true

      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-linux-arm64-${{ env.VERSION }}
          path: dist/wb2api-linux-arm64*

      - name: publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view build-latest >/dev/null 2>&1 || \
            gh release create build-latest --title "Latest linux/arm64 build" \
              --notes "Rolling linux/arm64 build of main; assets are overwritten on every run."
          gh release upload build-latest dist/wb2api-linux-arm64 dist/wb2api-linux-arm64.sha256 --clobber
          echo "### linux/arm64 build ${VERSION} ✅" >> "$GITHUB_STEP_SUMMARY"
